[package]
name = "tree-sitter-pageflow"
description = "PageFlow document markup language"
version = "0.1.0"
authors = ["Vsevolod Donchenko <vsevolond.dev@mail.ru>"]
license = "MIT"
readme = "README.md"
keywords = ["incremental", "parsing", "tree-sitter", "pageflow"]
categories = ["parser-implementations", "parsing", "text-editors"]
repository = "https://github.com/vsevolond/tree-sitter-pageflow"
edition = "2021"
autoexamples = false

build = "bindings/rust/build.rs"
include = [
  "bindings/rust/*",
  "grammar.js",
  "queries/*",
  "src/*",
  "tree-sitter.json",
  "/LICENSE",
]

[lib]
path = "bindings/rust/lib.rs"

[dependencies]
tree-sitter-language = "0.1"

[build-dependencies]
cc = "1.2"

[dev-dependencies]
tree-sitter = "0.25.10"
